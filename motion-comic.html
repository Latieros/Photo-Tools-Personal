<style>
/* Layout: the stage (preview, transport) | the writing column (scenes, steps, people, places, look). Stacks on phones with the preview kept in view. */
:root{
  --bg:#F2F1F6; --panel:#FFFFFF; --ink:#18161F; --muted:#686577; --line:#DDDAE6;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --stage:#E7E5EE; --check:#DCD9E4; --chip:#ECE8FF; --warn:#B4281E;
  --f-display:"Unbounded","Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118; --panel:#1B1A23; --ink:#EEEDF4; --muted:#9D9AAE; --line:#2F2D3B;
  --accent:#9C88FF; --accent-ink:#141020; --stage:#0C0B11; --check:#17161E; --chip:#26213F; --warn:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --panel:#1B1A23; --ink:#EEEDF4; --muted:#9D9AAE; --line:#2F2D3B;
  --accent:#9C88FF; --accent-ink:#141020; --stage:#0C0B11; --check:#17161E; --chip:#26213F; --warn:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:18px 40px}
[hidden]{display:none!important}
.top{max-width:1400px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font:600 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.chip{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;background:var(--chip);color:var(--accent);padding:6px 9px;border-radius:99px}
.top p{margin:0;color:var(--muted);flex-basis:100%}
.spacer{flex:1}
.switch{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-self:center;max-width:100%;overflow-x:auto}
.switch a{font:500 14px/1 var(--f-body);color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:7px;white-space:nowrap}
.switch a:hover{color:var(--ink)}
.switch a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.switch a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:500 14px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
button:hover,.btn:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
/* stage */
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-wrap{display:grid;place-items:center;padding:18px;border-radius:12px;min-height:380px;
  background:var(--stage) conic-gradient(var(--check) 25%,transparent 0 50%,var(--check) 0 75%,transparent 0) 0 0/22px 22px}
canvas#cv{display:block;max-width:100%;max-height:min(66vh,820px);width:auto;height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,.28));border-radius:6px;cursor:pointer;touch-action:manipulation}
.strip{position:relative;height:46px;border-radius:10px;overflow:hidden;display:flex;gap:2px;background:var(--line);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.seg{position:relative;flex:1 1 0;min-width:0;background:var(--panel);display:flex;align-items:flex-end;padding:0 8px 6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg i{position:absolute;left:0;top:0;height:5px;width:100%;opacity:.85}
.head{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);pointer-events:none}
.head::before{content:"";position:absolute;top:-1px;left:-7px;border:8px solid transparent;border-top:10px solid var(--ink)}
.transport{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:11ch}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.mode{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.mode button{border:0;padding:7px 11px;font-size:13px;background:transparent}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted)}
/* writing column */
.side{padding:0 0 16px;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3;border-radius:12px 12px 0 0;overflow-x:auto}
.tabs button{flex:1;border:0;border-radius:0;padding:12px 6px;font-size:13px;background:transparent;color:var(--muted);justify-content:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.pane{padding:6px 16px 10px;display:flex;flex-direction:column}
.sec{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:12px}
.sec:first-child{border-top:0}
.sec h2{font:600 13px/1.2 var(--f-display);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.rv{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
input[type=text],input[type=number],select,textarea{font:15px/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:58px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.seg-b{display:flex;flex-wrap:wrap;gap:6px}
.seg-b button{padding:8px 11px;font-size:13px}
.seg-b button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
.thumb.wide{width:72px}
.help{font-size:12px;color:var(--muted);margin:0}
.ib{padding:7px 9px;border-color:transparent;background:transparent;color:var(--muted)}
.ib:hover{border-color:var(--line);color:var(--ink)}
/* scenes and steps */
.scenes{display:flex;flex-direction:column;gap:4px}
.scene{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.scene.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scene .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scene .meta{font-size:12px;color:var(--muted)}
.scene .acts{display:flex;gap:2px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.step.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .hd{display:flex;align-items:center;gap:6px}
.step .hd .kind{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--chip);padding:5px 7px;border-radius:99px;white-space:nowrap}
.step .hd select{width:auto;flex:1;padding:6px 8px;font-size:13px}
.step .hd .acts{display:flex;gap:0}
.step .hd .acts button{padding:6px 7px}
.step textarea{min-height:52px;background:var(--panel)}
.step input[type=text],.step select{background:var(--panel)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,120px) auto;gap:6px;align-items:center}
.opt input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow button{padding:7px 10px;font-size:13px}
.people{display:flex;flex-direction:column;gap:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}
.person summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500;list-style:none}
.person summary::-webkit-details-marker{display:none}
.exprs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.expr{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:12px}
.expr .thumb{width:84px;height:84px;border-radius:10px}
.expr input[type=text]{font-size:13px;padding:5px 6px;text-align:center}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bgc{display:flex;flex-direction:column;gap:4px;font-size:12px;text-align:center}
.bgc .thumb{width:100%;height:68px;border-radius:8px}
/* dialogs */
.modal{position:fixed;inset:0;background:rgba(10,8,18,.72);display:grid;place-items:center;padding:20px;z-index:40}
.sheet{background:var(--panel);border-radius:14px;padding:18px;width:min(540px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sheet h3{margin:0;font:600 17px/1.2 var(--f-display)}
.vprog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.vprog div{height:100%;width:0;background:var(--accent);transition:width .15s}
.sheet video,.sheet img.out{max-height:50vh;max-width:100%;align-self:center;border-radius:6px;background:#000;border:1px solid var(--line)}
.status{min-height:1.2em;font-size:13px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:min(92vw,560px);text-align:center}
@media (max-width:900px){
  body{padding-inline:12px;padding-block:10px 40px}
  .top p{display:none}
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:0 -12px;padding:6px 12px 8px;box-shadow:0 10px 14px -14px rgba(0,0,0,.45)}
  .canvas-wrap{min-height:0;padding:6px}
  canvas#cv{max-height:40vh}
  .transport button{padding:9px 12px;font-size:15px}
  input[type=text],input[type=number],select,textarea{font-size:16px}
  .seg-b button{padding:10px 12px;font-size:14px}
  .tabs{top:0}
  .app:has(.side :is(input,textarea):focus) canvas#cv{max-height:16vh}
}
@media (max-width:900px) and (max-height:560px){.stage{position:static;box-shadow:none}canvas#cv{max-height:70vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.panels{display:flex;flex-direction:column;gap:8px}
.prow{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.prow .rh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.prow .rh input[type=range]{flex:1}
.pcards{display:flex;gap:8px;flex-wrap:wrap}
.pcard{flex:1 1 120px;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:var(--bg)}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .thumb{width:100%;height:70px;object-fit:cover}
.pcard .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bub .hd{display:flex;align-items:center;gap:6px}
.bub .hd .kind{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--chip);padding:5px 7px;border-radius:99px;white-space:nowrap}
.bub .hd select{width:auto;flex:1;padding:6px 8px;font-size:13px}
.bub textarea{min-height:48px;background:var(--panel)}
.bub input[type=text],.bub select{background:var(--panel)}
.bub .hd .acts{display:flex}
.bub .hd .acts button{padding:6px 7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px}
</style>

</head>
<body>
<header class="top">
  <h1 class="brand">Motion <span>Comic</span></h1>
  <nav class="switch" aria-label="Switch tool"><a href="photo-frame-studio.html">Frame Studio</a><a href="photo-splitter.html">Splitter</a><a href="chat-reel.html">Chat Reel</a><a href="metadata-scrubber.html">Scrubber</a><a href="video-layers.html">Video</a><a href="delivery-reel.html">Delivery</a><a href="visual-novel.html">Novel</a><a href="motion-comic.html" aria-current="page">Comic</a></nav>
  <span class="spacer"></span>
  <label class="btn" for="openProj">Open project<input type="file" id="openProj" accept=".json,application/json"></label>
  <button type="button" id="saveProj">Save project</button>
  <button type="button" id="picBtn">Still picture</button>
  <button type="button" id="exportBtn" class="primary">Export video</button>
  <p>Panels pop in, then their bubbles, with sound effects, speed lines and cut-ins. Scrolls down like a webtoon or turns pages like a book.</p>
</header>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<main class="app">
  <section class="stage" aria-label="Preview">
    <div class="canvas-wrap"><canvas id="cv" width="1080" height="1920" aria-label="Preview of the comic"></canvas></div>
    <div class="transport">
      <button type="button" id="play" class="primary"><span id="playIco" aria-hidden="true">▶</span><span id="playLbl">Play</span></button>
      <button type="button" id="restart" aria-label="Back to the start">⏮</button>
      <span class="clock" id="clock">0.0s / 0.0s</span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="loop"> Loop</label>
      <label class="chk"><input type="checkbox" id="mute"> Mute preview</label>
    </div>
    <div class="strip" id="strip" role="slider" tabindex="0" aria-label="Move through the comic" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span class="head" id="head"></span></div>
  </section>
  <aside class="card side" id="side" aria-label="Making">
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="pages" aria-selected="true">Pages</button><button type="button" role="tab" data-tab="panel" aria-selected="false">Panel</button><button type="button" role="tab" data-tab="people" aria-selected="false">Characters</button><button type="button" role="tab" data-tab="look" aria-selected="false">Look</button></div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<div class="modal" id="xmodal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="xTitle">
    <h3 id="xTitle">Export video</h3>
    <div class="field" id="xfmtF"><span class="flabel">Format</span><div class="seg-b" id="xfmt"></div></div>
    <div class="field" id="xsizeF"><span class="flabel">Size</span><div class="seg-b" id="xsize"></div></div>
    <label class="chk" id="xsoundL"><input type="checkbox" id="xsound" checked> Include the sounds</label>
    <p class="help" id="xHelp"></p>
    <div class="vprog" id="xProg" hidden><div id="xBar"></div></div>
    <video id="xVid" controls loop playsinline hidden></video>
    <img id="xImg" class="out" alt="Your export" hidden>
    <div class="row">
      <button type="button" id="xStart" class="primary">Start</button>
      <button type="button" id="xDl" class="primary" hidden>Save</button>
      <button type="button" id="xClose">Close</button>
    </div>
    <p class="help" id="xSave" hidden></p>
    <div class="status" id="xStatus" role="status"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv');let ctx=cv.getContext('2d'),W=1080,H=1920;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),easeO=p=>1-Math.pow(1-p,3),easeI=p=>p*p*p,smooth=p=>{p=clamp(p,0,1);return p*p*(3-2*p);},backO=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const rkey=()=>Math.random().toString(36).slice(2,9);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const dimsOf=src=>src.videoWidth?[src.videoWidth,src.videoHeight]:[src.naturalWidth||src.width,src.naturalHeight||src.height];
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},4200);}
const hexRGB=hx=>{const n=parseInt(String(hx).slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const hexA=(hx,a)=>{const[r,g,b]=hexRGB(hx);return`rgba(${r},${g},${b},${a})`;};
const isHex=x=>/^#[0-9a-f]{6}$/i.test(x||'');
const FAM={sys:'-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif',comic:'"Comic Neue","Comic Sans MS","Chalkboard SE",sans-serif',bang:'Bangers,Impact,"Arial Black",sans-serif'};
const F=(px,w,fam)=>`${w||400} ${px}px ${FAM[fam||'comic']}`;
const ICON={
  back:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
  more:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',

  await enc.add(pend,Math.round((d+1.5)*100)-Math.round(pendT*100));const blob=await enc.finish();onProg(1);return blob;}
/* ---------- the export dialog ---------- */
let xFormat='mp4',xQual='best',xResult=null,xKind='video';
const MB=1e6,mbs=n=>(n/MB).toFixed(1)+' MB';
function openExport(kind){xKind=kind||'video';pause();xResult=null;
  const fm=[];if(pickMime('mp4'))fm.push(['mp4','MP4']);if(pickMime('webm'))fm.push(['webm','WebM']);fm.push(['gif','GIF']);if(!fm.some(f=>f[0]===xFormat))xFormat=fm[0][0];
  const pic=xKind==='pic';$('xTitle').textContent=pic?'Still picture':'Export video';
  const xf=$('xfmt');xf.innerHTML='';if(!pic)fm.forEach(([k,l])=>xf.append(h('button',{type:'button','aria-pressed':String(k===xFormat),onclick:()=>{if(!busy){xFormat=k;openExport('video');}}},l)));
  $('xfmtF').hidden=pic;const gif=xFormat==='gif';$('xsizeF').hidden=pic||gif;$('xsoundL').hidden=pic||gif;
  const xs=$('xsize');xs.innerHTML='';[['best','Full size'],['half','Half size']].forEach(([k,l])=>xs.append(h('button',{type:'button','aria-pressed':String(k===xQual),onclick:()=>{if(!busy){xQual=k;openExport('video');}}},l)));
  $('xHelp').textContent=pic?(isBook()?`The page you’re on (${P.pages[PAGE]?P.pages[PAGE].name:'page'}) as a PNG, 1080 × 1440, with everything in place.`:`The whole strip as one tall PNG, 1080 wide, with everything in place. Good for posting as a webtoon.`):
    gif?'Loops on its own and works anywhere pictures do. No sound, and made at half size.':`${xFormat==='mp4'?'Plays almost everywhere, including iPhone and social apps.':'Small and sharp. Plays in Chrome, Firefox and on Android.'} It records in real time, about ${S.dur.toFixed(0)} seconds. Keep this tab in front while it records.`;
  ['xProg','xVid','xImg','xSave','xDl'].forEach(id=>$(id).hidden=true);$('xStart').disabled=false;$('xStart').textContent=pic?'Make the picture':'Start';$('xStatus').textContent='';$('xmodal').hidden=false;$('xStart').focus();}
$('exportBtn').onclick=()=>openExport('video');$('picBtn').onclick=()=>openExport('pic');
$('xClose').onclick=()=>{if(!busy){$('xmodal').hidden=true;drawNow();}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy)$('xmodal').hidden=true;});
const xprog=f=>{$('xBar').style.width=Math.round(f*100)+'%';};
$('xStart').onclick=async()=>{busy=true;pause();$('xStart').disabled=true;$('xClose').disabled=true;['xVid','xImg','xDl','xSave'].forEach(id=>$(id).hidden=true);
  try{if(xKind==='pic'){const c=stillPicture(PAGE);xResult=await new Promise(r=>c.toBlob(r,'image/png'));$('xImg').src=URL.createObjectURL(xResult);$('xImg').hidden=false;}
    else{$('xProg').hidden=false;xprog(0);$('xStatus').textContent=xFormat==='gif'?'Building the GIF…':'Recording… keep this tab in front.';
      if(xFormat==='gif'){xResult=await makeGif(xprog);$('xImg').src=URL.createObjectURL(xResult);$('xImg').hidden=false;}
      else{const snd=$('xsound').checked&&P.sounds!==false,mime=pickMime(xFormat,snd)||pickMime(xFormat);if(!mime)throw new Error('This browser can’t record video');
        xResult=await recordVideo(mime,xprog,{scale:xQual==='half'?.5:1,vbps:xQual==='half'?4e6:8e6,withSound:snd});$('xVid').src=URL.createObjectURL(xResult);$('xVid').hidden=false;}}
    $('xStatus').textContent=`Done. ${mbs(xResult.size)}.`;$('xDl').hidden=!canSave();$('xSave').hidden=false;
    $('xSave').textContent=canSave()?'Save puts it on your device. In the Claude app on a phone, it opens the share sheet so you can save it to Photos.':'Right-click it and choose Save, or press and hold it on a phone.';
    $('xStart').textContent='Make it again';}
  catch(err){$('xStatus').textContent='That didn’t work: '+(err&&err.message||err)+'. Try a GIF, or open this page in Chrome.';}
  finally{busy=false;$('xStart').disabled=false;$('xClose').disabled=false;drawNow();}};
$('xDl').onclick=async()=>{if(!xResult)return;const ext=xKind==='pic'?'png':xResult.type==='image/gif'?'gif':xFormat;$('xStatus').textContent=await saveFile(xResult,`comic-${slug(P.title)}-${rndCode()}.${ext}`);};
/* ---------- start ---------- */
load();S=sched();fitCanvas();renderStrip();renderSide();state.t=Math.min(S.dur,(S.panels[2]||S.panels[0]).end-.1);drawNow();restoreImgs();
document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>drawNow());
</script>
