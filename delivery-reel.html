<style>
/* Layout: phone preview with a stage strip under it | settings column; stacks on phones with the preview kept in view */
:root{
  --bg:#F2F1F6; --panel:#FFFFFF; --ink:#18161F; --muted:#686577; --line:#DDDAE6;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --stage:#E7E5EE; --check:#DCD9E4; --chip:#ECE8FF;
  --f-display:"Unbounded","Familjen Grotesk",system-ui,sans-serif;
  --f-body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118; --panel:#1B1A23; --ink:#EEEDF4; --muted:#9D9AAE; --line:#2F2D3B;
  --accent:#9C88FF; --accent-ink:#141020; --stage:#0C0B11; --check:#17161E; --chip:#26213F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --panel:#1B1A23; --ink:#EEEDF4; --muted:#9D9AAE; --line:#2F2D3B;
  --accent:#9C88FF; --accent-ink:#141020; --stage:#0C0B11; --check:#17161E; --chip:#26213F; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:18px 40px}
[hidden]{display:none!important}
.top{max-width:1300px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font:600 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.switch{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-self:center;max-width:100%;overflow-x:auto}
.switch a{font:500 14px/1 var(--f-body);color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:7px;white-space:nowrap}
.switch a:hover{color:var(--ink)}
.switch a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.switch a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;background:var(--chip);color:var(--accent);padding:6px 9px;border-radius:99px}
.top p{margin:0;color:var(--muted);flex-basis:100%}
.spacer{flex:1}
button,.btn{font:500 14px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative}
button:hover,.btn:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
/* stage */
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.canvas-wrap{display:grid;place-items:center;padding:18px;border-radius:12px;min-height:420px;
  background:var(--stage) conic-gradient(var(--check) 25%,transparent 0 50%,var(--check) 0 75%,transparent 0) 0 0/22px 22px}
canvas#cv{display:block;max-width:100%;max-height:min(66vh,820px);width:auto;height:auto;filter:drop-shadow(0 12px 28px rgba(0,0,0,.28));border-radius:6px}
.strip{position:relative;height:54px;border-radius:10px;overflow:hidden;display:flex;gap:2px;background:var(--line);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.seg{position:relative;flex:1 1 0;min-width:0;background:var(--panel);display:flex;align-items:flex-end;padding:0 8px 7px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg i{position:absolute;left:0;top:0;height:6px;width:100%;opacity:.85}
.head{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);pointer-events:none}
.head::before{content:"";position:absolute;top:-1px;left:-7px;border:8px solid transparent;border-top:10px solid var(--ink)}
.transport{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:11ch}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;flex:none}
/* settings */
.side{padding:6px 16px 16px;display:flex;flex-direction:column}
.sec{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:12px}
.sec:first-child{border-top:0}
.sec h2{font:600 13px/1.2 var(--f-display);margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.rv{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
input[type=text],input[type=number]{font:15px/1.4 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.seg-b{display:flex;flex-wrap:wrap;gap:6px}
.seg-b button{padding:8px 11px;font-size:13px}
.seg-b button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:58px minmax(0,1fr) 84px auto;gap:6px;align-items:center}
.item input{padding:7px 8px}
.msgrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:6px;align-items:center}
.msgrow .who{padding:8px 6px;font-size:13px}
.ib{padding:7px 9px;border-color:transparent;background:transparent;color:var(--muted)}
.ib:hover{border-color:var(--line);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
.help{font-size:12px;color:var(--muted);margin:0}
/* dialogs */
.modal{position:fixed;inset:0;background:rgba(10,8,18,.72);display:grid;place-items:center;padding:20px;z-index:40}
.sheet{background:var(--panel);border-radius:14px;padding:18px;width:min(540px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sheet h3{margin:0;font:600 17px/1.2 var(--f-display)}
.vprog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.vprog div{height:100%;width:0;background:var(--accent);transition:width .15s}
.sheet video,.sheet img.out{max-height:50vh;max-width:100%;align-self:center;border-radius:6px;background:#000;border:1px solid var(--line)}
.status{min-height:1.2em;font-size:13px;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:900px){
  body{padding-inline:12px;padding-block:10px 40px}
  .top p{display:none}
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:0 -12px;padding:6px 12px 8px;box-shadow:0 10px 14px -14px rgba(0,0,0,.45)}
  .canvas-wrap{min-height:0;padding:6px}
  canvas#cv{max-height:40vh}
  .strip{height:46px}.seg{font-size:11px;padding:0 5px 6px}
  .transport button{padding:9px 12px;font-size:15px}
  input[type=text],input[type=number]{font-size:16px}
  .seg-b button{padding:10px 12px;font-size:14px}
  .app:has(.side input:focus) canvas#cv{max-height:16vh}
}
@media (max-width:900px) and (max-height:560px){.stage{position:static;box-shadow:none}canvas#cv{max-height:70vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <h1 class="brand">Delivery <span>Reel</span></h1>
  <nav class="switch" aria-label="Switch tool"><a href="photo-frame-studio.html">Frame Studio</a><a href="photo-splitter.html">Splitter</a><a href="chat-reel.html">Chat Reel</a><a href="metadata-scrubber.html">Scrubber</a><a href="video-layers.html">Video</a><a href="delivery-reel.html" aria-current="page">Delivery</a></nav>
  <span class="spacer"></span>
  <button type="button" id="picBtn" title="Save the delivered screen as a picture">📷 Confirmation picture</button>
  <button type="button" id="exportBtn" class="primary">Export video</button>
  <p>An order from a made-up delivery app, from placed to delivered, ending on the delivered screen.</p>
</header>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<main class="app">
  <section class="stage" aria-label="Preview">
    <div class="canvas-wrap"><canvas id="cv" width="1080" height="2340" aria-label="Phone preview of the delivery"></canvas></div>
    <div class="strip" id="strip" role="slider" tabindex="0" aria-label="Move through the reel" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span class="head" id="head"></span></div>
    <div class="transport">
      <button type="button" id="play" class="primary"><span id="playIco" aria-hidden="true">▶</span><span id="playLbl">Play</span></button>
      <button type="button" id="restart" aria-label="Back to the start">⏮</button>
      <span class="clock" id="clock">0.0s / 0.0s</span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="loop" checked> Loop</label>
      <label class="chk"><input type="checkbox" id="mute"> Mute preview</label>
    </div>
  </section>
  <aside class="card side" id="side" aria-label="Settings"></aside>
</main>

<div class="modal" id="xmodal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="xTitle">
    <h3 id="xTitle">Export video</h3>
    <div class="field"><span class="flabel">Format</span><div class="seg-b" id="xfmt"></div></div>
    <div class="field" id="xsizeF"><span class="flabel">Size</span><div class="seg-b" id="xsize"></div></div>
    <label class="chk" id="xsoundL"><input type="checkbox" id="xsound" checked> Include the sounds</label>
    <p class="help" id="xHelp"></p>
    <div class="vprog" id="xProg" hidden><div id="xBar"></div></div>
    <video id="xVid" controls loop playsinline hidden></video>
    <img id="xImg" class="out" alt="Your export" hidden>
    <div class="row">
      <button type="button" id="xStart" class="primary">Start</button>
      <button type="button" id="xDl" class="primary" hidden>Save</button>
      <button type="button" id="xClose">Close</button>
    </div>
    <p class="help" id="xSave" hidden></p>
    <div class="status" id="xStatus" role="status"></div>
  </div>
</div>

function chatPlan(){const k=P.chatPace==='quick'?.6:1;let t=1.0;const ev=[];for(const m of(P.chat||[])){if(!String(m.text||'').trim())continue;t+=.35*k;const e={m,ta:t};e.arrive=t+(m.me?clamp(String(m.text).length/18,.4,2)*k+.15:.75*k);ev.push(e);t=e.arrive+.15*k;}

function sched(){const s={segs:[]};let t=0;const seg=(k,l,d)=>{const o={k,l,a:t,b:t+d,d};s.segs.push(o);t+=d;return o;};
  s.placed=seg('placed','Order placed',Math.max(1.4,+P.dur.placed||2.4));s.prep=seg('prep','Preparing',Math.max(1,+P.dur.prep||3));
  const drive=Math.max(1,+P.dur.way||6),cp=hasChat()?chatPlan():null;s.chat=null;s.chatPlan=cp;
  if(cp&&P.chatWhen==='start'){s.chat=seg('chat','Chat',cp.d);const w=seg('way','On the way',drive);s.way={a:w.a,b:w.b,d:drive};}
  else if(cp){const w1=seg('way','On the way',drive/2);s.chat=seg('chat','Chat',cp.d);const w2=seg('way','On the way',drive/2);s.way={a:w1.a,b:w2.b,d:drive};}
  else{const w=seg('way','On the way',drive);s.way={a:w.a,b:w.b,d:drive};}
  s.near=seg('near','Arriving',Math.max(1,+P.dur.near||2.2));
  const da=t;let e=da+1.9;s.shot=P.shot==='none'?null:da+1.9;if(s.shot!=null)e=s.shot+(P.shot==='thumb'?1.6:.7);
  s.open=null;if(P.open!=='off'){const v=VID.door,hold=v?Math.min(v.dur,30):Math.max(.5,+P.openHold||2.5),tap=e+.3;
    s.open={tap,a:tap+.35,full:tap+.9,hold,vid:!!v,close:P.open==='close'};s.open.cs=s.open.full+hold;s.open.ce=s.open.cs+.45;e=s.open.close?s.open.ce:s.open.cs;}
  s.done=seg('done','Delivered',(e-da)+Math.max(.3,+P.dur.done||1.6));s.dur=t;return s;}

const MW=1700,MH=2100;let MAP=null;
const NAMES=['Maple St','Oak Ave','Cedar St','Hill Rd','Park Ave','Elm St','Lake Dr','Pine St','Mill Rd','River St'];
function buildMap(){const r=mulberry(P.seed*7919+11),c=document.createElement('canvas');c.width=MW;c.height=MH;const g=c.getContext('2d');
  const xs=[],ys=[];for(let x=-60;x<MW+260;x+=170+r()*90)xs.push(Math.round(x));for(let y=-60;y<MH+260;y+=190+r()*100)ys.push(Math.round(y));
  const wx=xs.map((_,i)=>i%3===1?36:22),wy=ys.map((_,i)=>i%3===2?36:22);
  g.fillStyle='#FFFFFF';g.fillRect(0,0,MW,MH);
  const pi=2+Math.floor(r()*(xs.length-4)),pj=2+Math.floor(r()*(ys.length-4));
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){const x0=xs[i]+wx[i]/2,y0=ys[j]+wy[j]/2,x1=xs[i+1]-wx[i+1]/2,y1=ys[j+1]-wy[j+1]/2;if(x1-x0<10||y1-y0<10)continue;
    const park=i===pi&&j===pj;g.fillStyle=park?'#CDEDD2':(r()<.5?'#ECEFF3':'#E9ECF1');g.beginPath();g.roundRect?g.roundRect(x0,y0,x1-x0,y1-y0,10):g.rect(x0,y0,x1-x0,y1-y0);g.fill();
    if(park){g.fillStyle='#B6E2BE';for(let k=0;k<6;k++){g.beginPath();g.arc(x0+20+r()*(x1-x0-40),y0+20+r()*(y1-y0-40),10+r()*12,0,Math.PI*2);g.fill();}}
    else{g.fillStyle='#E1E5EB';const n=1+Math.floor(r()*3);for(let k=0;k<n;k++){const bw=(x1-x0)*(.25+r()*.3),bh=(y1-y0)*(.25+r()*.3),bx=x0+10+r()*(x1-x0-bw-20),by=y0+10+r()*(y1-y0-bh-20);g.fillRect(bx,by,bw,bh);}}}
  /* a river across one corner */
  g.fillStyle='#C6E2F5';g.beginPath();g.moveTo(MW,MH*.62);g.bezierCurveTo(MW*.78,MH*.7,MW*.86,MH*.86,MW*.64,MH);g.lineTo(MW,MH);g.closePath();g.fill();
  g.fillStyle='#9AA3AE';g.font=F(22,500);g.textAlign='center';g.textBaseline='middle';
  const nm=[...NAMES].sort(()=>r()-.5);
  [1,4].forEach((i,k)=>{if(!xs[i])return;g.save();g.translate(xs[i],MH*.3+k*220);g.rotate(-Math.PI/2);g.fillText(nm[k],0,0);g.restore();});
  [2,5].forEach((j,k)=>{if(!ys[j])return;g.fillText(nm[k+2],MW*.25+k*380,ys[j]);});
  /* the restaurant and home sit on street corners; the route follows the streets */
  const i1=Math.floor(xs.length*.3+r()*2),j1=Math.floor(ys.length*.28+r()*2),i2=Math.min(xs.length-3,i1+2+Math.floor(r()*2)),j2=Math.min(ys.length-3,j1+3+Math.floor(r()*2)),jm=j1+1+Math.floor(r()*Math.max(1,j2-j1-1));
  const pts=[[xs[i1],ys[j1]],[xs[i1],ys[jm]],[xs[i2],ys[jm]],[xs[i2],ys[j2]]].filter((p,k,a)=>!k||p[0]!==a[k-1][0]||p[1]!==a[k-1][1]);
  const cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));

async function confirmationPng(){if(VID.door)await seekVid(0);frame(S.dur,{clean:true});const b=await new Promise(r=>cv.toBlob(r,'image/png'));drawNow();return b;}

/* ================= export dialog ================= */
let xFormat='mp4',xQual='best',xResult=null,xKind='video';
const MB=1e6,mbs=n=>(n/MB).toFixed(1)+' MB';
function openExport(kind){xKind=kind||'video';pause();xResult=null;
  const fm=[];if(pickMime('mp4'))fm.push(['mp4','MP4']);if(pickMime('webm'))fm.push(['webm','WebM']);fm.push(['gif','GIF']);if(!fm.some(f=>f[0]===xFormat))xFormat=fm[0][0];
  const pic=xKind==='pic';$('xTitle').textContent=pic?'Confirmation picture':'Export video';
  const xf=$('xfmt');xf.innerHTML='';if(!pic)fm.forEach(([k,l])=>xf.append(h('button',{type:'button','aria-pressed':String(k===xFormat),onclick:()=>{if(!busy){xFormat=k;openExport('video');}}},l)));
  xf.parentElement.hidden=pic;const gif=xFormat==='gif';$('xsizeF').hidden=pic||gif;$('xsoundL').hidden=pic||gif;
  const xs=$('xsize');xs.innerHTML='';[['best','Full size'],['half','Half size']].forEach(([k,l])=>xs.append(h('button',{type:'button','aria-pressed':String(k===xQual),onclick:()=>{if(!busy){xQual=k;openExport('video');}}},l)));
  $('xHelp').textContent=pic?'The delivered screen as a PNG picture, 1080 × 2340, the way a screenshot of it would look.':gif?'Loops on its own and works anywhere pictures do. No sound, and made at half size.':`${xFormat==='mp4'?'Plays almost everywhere, including iPhone and social apps.':'Small and sharp. Plays in Chrome, Firefox and on Android.'} It records in real time, about ${S.dur.toFixed(0)} seconds. Keep this tab in front while it records.`;
  ['xProg','xVid','xImg','xSave','xDl'].forEach(id=>$(id).hidden=true);$('xStart').disabled=false;$('xStart').textContent=pic?'Make the picture':'Start';$('xStatus').textContent='';$('xmodal').hidden=false;$('xStart').focus();}
$('exportBtn').onclick=()=>openExport('video');$('picBtn').onclick=()=>openExport('pic');
$('xClose').onclick=()=>{if(!busy){$('xmodal').hidden=true;drawNow();}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy)$('xmodal').hidden=true;});
const xprog=f=>{$('xBar').style.width=Math.round(f*100)+'%';};
$('xStart').onclick=async()=>{busy=true;pause();$('xStart').disabled=true;$('xClose').disabled=true;['xVid','xImg','xDl','xSave'].forEach(id=>$(id).hidden=true);
  try{if(xKind==='pic'){xResult=await confirmationPng();$('xImg').src=URL.createObjectURL(xResult);$('xImg').hidden=false;}
    else{$('xProg').hidden=false;xprog(0);$('xStatus').textContent=xFormat==='gif'?'Building the GIF…':'Recording… keep this tab in front.';
      if(xFormat==='gif'){xResult=await makeGif(xprog);$('xImg').src=URL.createObjectURL(xResult);$('xImg').hidden=false;}
      else{const snd=$('xsound').checked&&P.sound,mime=pickMime(xFormat,snd)||pickMime(xFormat);if(!mime)throw new Error('This browser can’t record video');
        xResult=await recordVideo(mime,xprog,{scale:xQual==='half'?.5:1,vbps:xQual==='half'?4e6:8e6,withSound:snd});$('xVid').src=URL.createObjectURL(xResult);$('xVid').hidden=false;}}
    $('xStatus').textContent=`Done. ${mbs(xResult.size)}.`;$('xDl').hidden=!canSave();$('xSave').hidden=false;
    $('xSave').textContent=canSave()?'Save puts it on your device. In the Claude app on a phone, it opens the share sheet so you can save it to Photos.':'Right-click it and choose Save, or press and hold it on a phone.';
    $('xStart').textContent='Make it again';}
  catch(err){$('xStatus').textContent='That didn’t work: '+(err&&err.message||err)+'. Try a GIF, or open this page in Chrome.';}
  finally{busy=false;$('xStart').disabled=false;$('xClose').disabled=false;drawNow();}};
$('xDl').onclick=async()=>{if(!xResult)return;const ext=xKind==='pic'?'png':xResult.type==='image/gif'?'gif':xFormat;$('xStatus').textContent=await saveFile(xResult,`${xKind==='pic'?'delivered':'delivery'}-${rndCode()}.${ext}`);};

/* ================= start ================= */
load();S=sched();buildMap();renderStrip();renderSide();state.t=S.way.a+S.way.d*.55;drawNow();restoreImgs();
document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>drawNow());
</script>
